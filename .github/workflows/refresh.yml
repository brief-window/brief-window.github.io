name: Refresh Brief Window

on:
  workflow_dispatch:
  # cron-job.org dispatches at :03 and :33. Keep one scheduler to avoid duplicates.

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      collection_outcome: ${{ steps.collect.outcome }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      reader_artifact_id: ${{ steps.reader_upload.outputs['artifact-id'] }}
      reader_artifact_digest: ${{ steps.reader_upload.outputs['artifact-digest'] }}
      reader_status_json: ${{ steps.reader_metadata.outputs.status_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check collector
        run: python -m unittest discover -s tests -v
      - name: Restore category metadata cache (no post bodies)
        uses: actions/cache@v4
        with:
          path: .cache/forum-categories.json
          key: forum-categories-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: forum-categories-v1-
      - name: Restore RSS topic classification cache (no post bodies)
        uses: actions/cache@v4
        with:
          path: .cache/forum-topics.json
          key: forum-topics-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: forum-topics-v1-
      - name: Randomize collection start by up to eight minutes
        run: |
          python - <<'PY'
          import random
          import time
          delay = random.randint(0, 480)
          print(f"Collection start delay: {delay} seconds.", flush=True)
          time.sleep(delay)
          PY
      - name: Collect forum posts
        id: collect
        continue-on-error: true
        run: python collector.py --source rss --category-cache .cache/forum-categories.json --topic-cache .cache/forum-topics.json
      - name: Record collection failure without duplicate email
        if: steps.collect.outcome != 'success'
        run: echo "::warning::Forum collection failed. The feed reports ok=false; the health job sends one alert after 60 minutes."
      - name: Prepare reader metadata
        id: reader_metadata
        run: python reader_index.py status
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1
      - name: Upload latest reader snapshot
        id: reader_upload
        uses: actions/upload-artifact@v4
        with:
          name: brief-window-feed
          path: public/feed.json
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Delete temporary feed artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}"

  publish-reader-index:
    needs: [build, deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.build.outputs.reader_artifact_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout index publisher
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish latest index and then remove superseded snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          READER_ARTIFACT_ID: ${{ needs.build.outputs.reader_artifact_id }}
          READER_ARTIFACT_DIGEST: ${{ needs.build.outputs.reader_artifact_digest }}
          FEED_STATUS_JSON: ${{ needs.build.outputs.reader_status_json }}
        run: python3 reader_index.py publish

  collection-health:
    needs: [build, deploy, publish-reader-index]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.build.outputs.reader_status_json != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout health monitor
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Record health and notify once per sustained outage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FEED_STATUS_JSON: ${{ needs.build.outputs.reader_status_json }}
        run: python3 collection_health.py
