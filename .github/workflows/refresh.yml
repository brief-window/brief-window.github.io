name: Refresh Brief Window

on:
  workflow_dispatch:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      collection_outcome: ${{ steps.collect.outcome }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      reader_artifact_id: ${{ steps.reader_upload.outputs['artifact-id'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check collector
        run: python -m unittest discover -s tests -v
      - name: Collect forum posts
        id: collect
        continue-on-error: true
        run: python collector.py
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1
      - name: Upload latest reader snapshot
        id: reader_upload
        uses: actions/upload-artifact@v4
        with:
          name: brief-window-feed
          path: public/feed.json
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Delete temporary feed artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}"
      - name: Remove older reader snapshots
        if: ${{ always() && needs.build.outputs.reader_artifact_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          READER_ARTIFACT_ID: ${{ needs.build.outputs.reader_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$READER_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api --paginate "repos/${GH_REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "brief-window-feed") | .id' |
          while IFS= read -r task_snapshot_id; do
            if [[ "$task_snapshot_id" =~ ^[0-9]+$ ]] && (( task_snapshot_id < READER_ARTIFACT_ID )); then
              gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${task_snapshot_id}"
            fi
          done
      - name: Report collection failure
        if: needs.build.outputs.collection_outcome != 'success'
        run: |
          echo "Collection failed. An empty status page was deployed to replace old posts."
          exit 1
