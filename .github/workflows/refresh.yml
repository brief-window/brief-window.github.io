name: Refresh Brief Window

on:
  workflow_dispatch:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      collection_outcome: ${{ steps.collect.outcome }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      reader_artifact_id: ${{ steps.reader_upload.outputs['artifact-id'] }}
      reader_artifact_digest: ${{ steps.reader_upload.outputs['artifact-digest'] }}
      reader_status_json: ${{ steps.reader_metadata.outputs.status_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check collector
        run: python -m unittest discover -s tests -v
      - name: Collect forum posts
        id: collect
        continue-on-error: true
        run: python collector.py
      - name: Prepare reader metadata
        id: reader_metadata
        run: python reader_index.py status
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1
      - name: Upload latest reader snapshot
        id: reader_upload
        uses: actions/upload-artifact@v4
        with:
          name: brief-window-feed
          path: public/feed.json
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Delete temporary feed artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}"
      - name: Report collection failure
        if: needs.build.outputs.collection_outcome != 'success'
        run: |
          echo "Collection failed. An empty status page was deployed to replace old posts."
          exit 1

  publish-reader-index:
    needs: [build, deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.build.outputs.reader_artifact_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout index publisher
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish latest index and then remove superseded snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          READER_ARTIFACT_ID: ${{ needs.build.outputs.reader_artifact_id }}
          READER_ARTIFACT_DIGEST: ${{ needs.build.outputs.reader_artifact_digest }}
          FEED_STATUS_JSON: ${{ needs.build.outputs.reader_status_json }}
        run: python3 reader_index.py publish
